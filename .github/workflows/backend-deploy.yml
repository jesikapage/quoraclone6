name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install and Build Backend
        env:
          # URL tiruan untuk mengecoh mesin Prisma saat kompilasi
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: |
          cd apps/backend
          bun install
          bun run build

      - name: Package to ZIP
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: |
          cd apps/backend
          # 1. Reset dependensi ke NPM agar konsisten
          rm -rf node_modules
          npm install --omit=dev
          npx prisma generate

          # 2. Pemangkasan Ekstrem Biner Prisma (Bypass 250MB AWS Limit)
          rm -rf node_modules/prisma
          rm -rf node_modules/@prisma/engines
          rm -rf node_modules/.cache

          # 3. Pisahkan node_modules yang sudah dipangkas ke struktur Layer AWS
          mkdir -p lambda-layer/nodejs
          cp -r node_modules lambda-layer/nodejs/

          # 4. Kompresi diam (-q) dengan retensi symlink (-y) untuk mencegah infinite loop
          zip -ryq lambda-layer.zip lambda-layer/

          # 5. Kompresi kode logika utama (dist)
          zip -ryq deploy-backend.zip dist/ package.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Layer via S3 to AWS Lambda
        run: |
          # A. Transit file ZIP ke S3 (Bypass 50MB Terminal Upload Limit)
          aws s3 cp apps/backend/lambda-layer.zip s3://quoraclone6-frontend/backend-layer-temp.zip

          # B. Instruksikan AWS Lambda mengambil Layer dari jaringan internal S3
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name quora-backend-deps \
            --content S3Bucket=quoraclone6-frontend,S3Key=backend-layer-temp.zip \
            --compatible-runtimes nodejs20.x \
            --query 'Version' \
            --output text)

          echo "LAYER_VERSION=$LAYER_VERSION" >> $GITHUB_ENV

          # C. Pembersihan otomatis file transit di S3
          aws s3 rm s3://quoraclone6-frontend/backend-layer-temp.zip

      - name: Deploy Code to AWS Lambda
        run: |
          # X. Perbarui logika kode
          aws lambda update-function-code \
            --function-name quora-backend-api \
            --zip-file fileb://apps/backend/deploy-backend.zip

          # Y. Jeda proses hingga AWS selesai memuat kode baru
          aws lambda wait function-updated \
            --function-name quora-backend-api

          # Z. Tempelkan Layer pustaka terbaru ke fungsi Lambda
          aws lambda update-function-configuration \
            --function-name quora-backend-api \
            --layers arn:aws:lambda:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:layer:quora-backend-deps:${{ env.LAYER_VERSION }}
