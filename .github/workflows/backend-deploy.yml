name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install and Build Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd apps/backend
          bun install
          bun run build

      - name: Package to ZIP
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd apps/backend
          rm -rf node_modules
          npm install --omit=dev
          npx prisma generate

          # Pisahkan node_modules ke layer
          mkdir -p lambda-layer/nodejs
          cp -r node_modules lambda-layer/nodejs/
          zip -r lambda-layer.zip lambda-layer/

          # Zip hanya dist (kecil!)
          zip -r deploy-backend.zip dist/ package.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Layer to AWS Lambda
        run: |
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name quora-backend-deps \
            --zip-file fileb://apps/backend/lambda-layer.zip \
            --compatible-runtimes nodejs20.x \
            --query 'Version' \
            --output text)

          echo "LAYER_VERSION=$LAYER_VERSION" >> $GITHUB_ENV

      - name: Deploy Code to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name quora-backend-api \
            --zip-file fileb://apps/backend/deploy-backend.zip

          # Tunggu update selesai dulu
          aws lambda wait function-updated \
            --function-name quora-backend-api

          # Attach layer ke Lambda
          aws lambda update-function-configuration \
            --function-name quora-backend-api \
            --layers arn:aws:lambda:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:layer:quora-backend-deps:${{ env.LAYER_VERSION }}
