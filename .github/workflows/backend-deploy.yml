name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install and Build Backend
        env:
          # Injeksi URL tiruan untuk meloloskan validasi Prisma
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: |
          cd apps/backend
          bun install
          bun run build

      - name: Package to ZIP
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: |
          cd apps/backend
          rm -rf node_modules
          npm install --omit=dev
          npx prisma generate

          # Pisahkan node_modules ke layer
          mkdir -p lambda-layer/nodejs
          cp -r node_modules lambda-layer/nodejs/

          # Compress layer dengan flag -ryq untuk mencegah infinite symlink loop
          zip -ryq lambda-layer.zip lambda-layer/

          # Zip hanya folder dist untuk kode utama
          zip -ryq deploy-backend.zip dist/ package.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Layer via S3 to AWS Lambda
        run: |
          # 1. Transit file raksasa ke S3 untuk menghindari batas 50MB API Terminal
          aws s3 cp apps/backend/lambda-layer.zip s3://quoraclone6-frontend/backend-layer-temp.zip

          # 2. Tarik file dari S3 ke sistem Lambda Layers
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name quora-backend-deps \
            --content S3Bucket=quoraclone6-frontend,S3Key=backend-layer-temp.zip \
            --compatible-runtimes nodejs20.x \
            --query 'Version' \
            --output text)

          echo "LAYER_VERSION=$LAYER_VERSION" >> $GITHUB_ENV

          # 3. Segera bersihkan file transit dari S3
          aws s3 rm s3://quoraclone6-frontend/backend-layer-temp.zip

      - name: Deploy Code to AWS Lambda
        run: |
          # Perbarui kode logika bisnis
          aws lambda update-function-code \
            --function-name quora-backend-api \
            --zip-file fileb://apps/backend/deploy-backend.zip

          # Tunggu status Lambda menjadi Ready
          aws lambda wait function-updated \
            --function-name quora-backend-api

          # Tempelkan layer terbaru ke fungsi Lambda
          aws lambda update-function-configuration \
            --function-name quora-backend-api \
            --layers arn:aws:lambda:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:layer:quora-backend-deps:${{ env.LAYER_VERSION }}
