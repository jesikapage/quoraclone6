name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # ─── TAHAP 1: BUILD ───────────────────────────────────────────────────
      - name: Build Backend (Bun)
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: |
          cd apps/backend
          bun install
          bun run build

      # ─── TAHAP 2: INSTALL PROD DEPS (NPM) ────────────────────────────────
      - name: Install Production Dependencies (npm)
        env:
          DATABASE_URL: "postgresql://johndoe:randompassword@localhost:5432/mydb?schema=public"
        run: |
          cd apps/backend
          rm -rf node_modules
          npm install --omit=dev --ignore-scripts
          npx prisma generate --schema=prisma/schema-postgres.prisma

      # ─── TAHAP 3: AGRESSIVE PRUNING ──────────────────────────────────────
      - name: Prune node_modules (Target < 200MB unzipped)
        run: |
          cd apps/backend/node_modules

          # [A] Hapus self-reference circular 
          rm -rf backend

          # [B] Hapus Prisma CLI (TETAPI PERTAHANKAN MESIN BINER AGAR TIDAK CRASH)
          rm -rf prisma
          # KOREKSI KRITIS: Baris di bawah ini dimatikan agar database bisa dibaca
          # rm -rf @prisma/engines 

          # [C] Hapus WASM compiler untuk database yang tidak dipakai
          cd @prisma/client/runtime
          rm -f query_compiler_fast_bg.mysql.*
          rm -f query_compiler_fast_bg.sqlite.*
          rm -f query_compiler_fast_bg.sqlserver.*
          rm -f query_compiler_fast_bg.cockroachdb.*
          rm -f query_compiler_small_bg.mysql.*
          rm -f query_compiler_small_bg.sqlite.*
          rm -f query_compiler_small_bg.sqlserver.*
          rm -f query_compiler_small_bg.cockroachdb.*
          cd ../../..

          # [D] Hapus generator-build 
          rm -rf @prisma/client/generator-build

          # [E] Hapus @electric-sql/pglite 
          rm -rf @electric-sql

          # [F] Hapus build tools yang ikut sebagai transitif dependency
          rm -rf @rolldown
          rm -rf tsdown
          rm -rf rollup
          rm -rf esbuild

          # [G] Hapus type definitions 
          find . -name "*.d.ts" -not -path "*/prisma/*" -delete
          find . -name "*.d.mts" -not -path "*/prisma/*" -delete

          # [H] Hapus source maps
          find . -name "*.js.map" -delete
          find . -name "*.mjs.map" -delete

          # [I] Hapus test/docs/example folders
          find . -maxdepth 3 -type d \( -name "test" -o -name "tests" -o -name "__tests__" -o -name "docs" -o -name "examples" -o -name "example" \) -exec rm -rf {} + 2>/dev/null || true

          cd ..
          echo "=== Ukuran node_modules setelah pruning ==="
          du -sh node_modules/

      # ─── TAHAP 4: PACKAGE ────────────────────────────────────────────────
      - name: Package ZIP Files
        run: |
          cd apps/backend

          mkdir -p lambda-layer/nodejs
          cp -r node_modules lambda-layer/nodejs/

          zip -ryq lambda-layer.zip lambda-layer/

          UNZIP_SIZE=$(unzip -l lambda-layer.zip | tail -1 | awk '{print $1}')
          echo "Estimasi unzipped size: $UNZIP_SIZE bytes"
          if [ "$UNZIP_SIZE" -gt 262144000 ]; then
            echo "ERROR: Ukuran unzipped ($UNZIP_SIZE bytes) melebihi limit AWS 250MB!"
            exit 1
          fi

          zip -ryq deploy-backend.zip dist/ package.json src/generated/

      # ─── TAHAP 5: AWS CREDENTIALS ─────────────────────────────────────────
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ─── TAHAP 6: DEPLOY LAYER ────────────────────────────────────────────
      - name: Deploy Layer via S3 to AWS Lambda
        run: |
          aws s3 cp apps/backend/lambda-layer.zip s3://quoraclone6-frontend/backend-layer-temp.zip

          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name quora-backend-deps \
            --content S3Bucket=quoraclone6-frontend,S3Key=backend-layer-temp.zip \
            --compatible-runtimes nodejs24.x \
            --query 'Version' \
            --output text)

          echo "LAYER_VERSION=$LAYER_VERSION" >> $GITHUB_ENV

          aws s3 rm s3://quoraclone6-frontend/backend-layer-temp.zip

      # ─── TAHAP 7: DEPLOY CODE ─────────────────────────────────────────────
      - name: Deploy Code to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name quora-backend-api \
            --zip-file fileb://apps/backend/deploy-backend.zip

          aws lambda wait function-updated \
            --function-name quora-backend-api

          # KOREKSI KRITIS: Penambahan parameter --handler dist/index.handler
          aws lambda update-function-configuration \
            --function-name quora-backend-api \
            --handler dist/index.handler \
            --layers arn:aws:lambda:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:layer:quora-backend-deps:${{ env.LAYER_VERSION }}
